FEATURES {
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __EXEHDR__:          type = import;
    __SYSTEM_CHECK__:    type = import;  # force inclusion of "system check" load chunk
    __AUTOSTART__:       type = import;  # force inclusion of autostart "trailer"
    __STACKSIZE__:       type = weak, value = $0800; # 2k stack
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $3420;
}
MEMORY {
    ZP:         file = "", define = yes, start = $0082, size = $007E;

# file header, just $FFFF
    HEADER:     file = %O,               start = $0000, size = $0002;

# "system check" load chunk
    SYSCHKHDR:  file = %O,               start = $0000, size = $0004;
    SYSCHKCHNK: file = %O,               start = $2E00, size = $0300;
    SYSCHKTRL:  file = %O,               start = $0000, size = $0006;

# "main program" load chunk
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = %S,    size = $BC20 - __STACKSIZE__ - __RESERVED_MEMORY__ - %S;
    VIDEO:      file = "", define = yes, start = $8800, size = $0400;
    FONT:       file = "", define = yes, start = $8C00, size = $0400;
    PMG:        file = "", define = yes, start = $9000, size = $0800;
    STAGING:    file = "", define = yes, start = $9800, size = $0800;
    LOADHDR: file = %O, start = $0000, size = $0004;
    LOW: file = %O, define = yes, start = $0600, size = $1200;
    ARTHDR:     file = %O, start = $0000, size = $0004;
    ASSETS:     file = %O, define = yes, start = $A000, size = $1800;
    TRAILER:    file = %O,               start = $0000, size = $0006;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,         type = zp;
    EXTZP:     load = ZP,         type = zp,                optional = yes;
    EXEHDR:    load = HEADER,     type = ro;
    SYSCHKHDR: load = SYSCHKHDR,  type = ro,                optional = yes;
    SYSCHK:    load = SYSCHKCHNK, type = rw,  define = yes, optional = yes;
    SYSCHKTRL: load = SYSCHKTRL,  type = ro,                optional = yes;
    MAINHDR:   load = MAINHDR,    type = ro;
    STARTUP:   load = MAIN,       type = ro,  define = yes;
    LOWBSS:    load = MAIN,       type = rw,                optional = yes;  # not zero initialized
    LOWCODE:   load = MAIN,       type = ro,  define = yes, optional = yes;
    ONCE:      load = MAIN,       type = ro,                optional = yes;
    CODE:      load = MAIN,       type = ro,  define = yes;
    RODATA:    load = MAIN,       type = ro;
    DATA:      load = MAIN,       type = rw, define = yes;
    INIT:      load = MAIN,       type = rw,                optional = yes;
    BSS:       load = MAIN,       type = bss, define = yes, align = $0002;
    SCREEN:    load = VIDEO, type = bss, align = $0400, define = yes, optional = yes;
    CHARSET:   load = FONT, type = bss, align = $0400, define = yes, optional = yes;
    PMGDATA:   load = PMG, type = bss, align = $0800, define = yes, optional = yes;
    IO_BUFFER: load = STAGING, type = bss, define = yes, optional = yes;
    LOADHDR: load = LOADHDR, type = ro;
    LOADER: load = LOW, type = ro, define = yes;
    LOADCONST: load = LOW, type = ro, define = yes;
    LOADBSS: load = LOW, type = bss, define = yes;
    SECTOR_BUFFER: load = STAGING, type = bss, start = $9C00, define = yes;
    RESOURCE:  load = ASSETS, type = bss, define = yes, optional = yes;
    ARTHDR: load = ARTHDR, type = ro;
    ART: load = ASSETS, type = ro, define = yes;
    AUTOSTRT:  load = TRAILER,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
